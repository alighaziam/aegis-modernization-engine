services:
  aegis:
    build:
      context: .
      dockerfile: Dockerfile
    image: aegis-modernization-engine:local
    init: true
    user: "10001:10001"
    working_dir: /workspace
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    volumes:
      - ./workspace:/workspace:rw
    mem_limit: 2g
    cpus: 2.0
